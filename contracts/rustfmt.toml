# rustfmt.toml — Stellar-Spend Soroban workspace formatting rules
#
# These options are all stable-channel features so that `cargo fmt --check`
# works under the stable toolchain CI uses (see .github/workflows/contract.yml).
# Nightly-only knobs (imports_granularity, group_imports, imports_layout,
# trailing_comma, blank_lines_upper_bound/lower_bound, comment_width,
# wrap_comments, normalize_comments, normalize_doc_attributes) were removed so
# formatting is deterministic on stable Rust.
#
# Run `cargo fmt` to apply. CI enforces this via `cargo fmt --check`.

edition = "2021"

# Indentation
tab_spaces = 4
hard_tabs = false

# Line length
max_width = 100
use_small_heuristics = "Default"

# Misc
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
merge_derives = true
