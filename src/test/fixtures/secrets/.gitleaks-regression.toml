title = "Gitleaks Regression Detection Config"

# Extends the built-in gitleaks rules with NO allowlist so that the synthetic
# secret fixtures under src/test/fixtures/secrets/ are detected. This config is
# used only by the gitleaks regression test (src/test/gitleaks-regression.test.ts)
# and is intentionally separated from the repo-wide .gitleaks.toml (which
# allowlists tests/fixtures to keep the main CI scan green).

[extend]
useDefault = true

# Synthetic, GitHub-push-protection-safe detection rules for the regression
# fixtures. The real provider prefixes (xoxb-, sk_live_) are intentionally
# avoided so the fixtures can be committed without tripping GitHub secret
# scanning push protection, while still proving gitleaks detects the pattern.
[[rules]]
id = "synthetic-slack-token"
description = "Synthetic Slack token (regression fixture; not a real credential)"
regex = '''slack-synth-token-[0-9A-Za-z]{36}'''

[[rules]]
id = "synthetic-stripe-key"
description = "Synthetic Stripe key (regression fixture; not a real credential)"
regex = '''stripe-synth-key-[0-9a-zA-Z]{24}'''
